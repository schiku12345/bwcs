<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Bedwars Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Rajdhani',sans-serif;color:#fff;}
:root{
  --acc:#4488ff;--acc2:#00e5ff;
  --glow:rgba(68,136,255,.22);--b1:rgba(68,136,255,.12);--b2:rgba(0,229,255,.06);
  --panel:rgba(5,8,20,.93);--bor:rgba(255,255,255,.10);
  --fd:'Orbitron',monospace;
}
@keyframes breathe{0%,100%{box-shadow:0 0 16px var(--b1),inset 0 0 16px var(--b2);}50%{box-shadow:0 0 36px var(--b1),0 0 70px var(--glow),inset 0 0 28px var(--b2);}}
@keyframes bpulse{0%,100%{border-color:rgba(255,255,255,.08);}50%{border-color:rgba(255,255,255,.24);}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes glowPulse{0%,100%{text-shadow:0 0 10px var(--acc),0 0 28px var(--acc);}50%{text-shadow:0 0 20px var(--acc),0 0 60px var(--acc),0 0 90px var(--acc2);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}
@keyframes slideOut{from{transform:none;opacity:1}to{transform:translateX(-110%);opacity:0}}
@keyframes fadeInC{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeOutC{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.04)}}
@keyframes flipIn{from{opacity:0;transform:rotateY(-80deg)}to{opacity:1;transform:none}}
@keyframes flipOut{from{opacity:1;transform:none}to{opacity:0;transform:rotateY(80deg)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}
@keyframes shimmerText{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes glitchAnim{0%,100%{transform:none;filter:none}10%{transform:translate(-3px,1px) skewX(-2deg);filter:hue-rotate(20deg)}20%{transform:translate(3px,-1px)}88%{transform:none;filter:none}91%{transform:translate(2px,0);filter:brightness(1.4)}}
@keyframes fadeInTxt{from{opacity:0;letter-spacing:.8em}to{opacity:1;letter-spacing:.4em}}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 18px var(--acc));}50%{filter:drop-shadow(0 0 50px var(--acc)) drop-shadow(0 0 90px var(--acc2));}}
@keyframes logoFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-20px);}}
@keyframes logoSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes logoBounce{0%,100%{transform:translateY(0);}40%{transform:translateY(-35px);}60%{transform:translateY(-18px);}}
@keyframes logoGlitch{0%,100%{transform:none;filter:drop-shadow(0 0 18px var(--acc));}10%{transform:translate(-5px,2px) skewX(-3deg);filter:hue-rotate(30deg) brightness(1.3);}20%{transform:translate(5px,-2px);}}
@keyframes logoReveal{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0% 0 0);}}
.anim-pulse .logo-img{animation:logoPulse 2.5s ease-in-out infinite;}
.anim-float .logo-img{animation:logoFloat 3s ease-in-out infinite,logoPulse 2.5s ease-in-out infinite;}
.anim-spin .logo-img{animation:logoSpin 8s linear infinite;}
.anim-bounce .logo-img{animation:logoBounce 1.6s ease-in-out infinite;}
.anim-glitch .logo-img{animation:logoGlitch 3s ease-in-out infinite;}
.anim-reveal .logo-img{animation:logoReveal 1.5s cubic-bezier(.22,1,.36,1) forwards;}
.text-shimmer{background:linear-gradient(90deg,var(--acc) 0%,var(--acc2) 40%,#fff 50%,var(--acc2) 60%,var(--acc) 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmerText 3s linear infinite;}
.text-glitch{animation:glitchAnim 3s ease-in-out infinite;}
.text-fade{animation:fadeInTxt 2s ease forwards;}
.text-typewriter{overflow:hidden;white-space:nowrap;border-right:3px solid var(--acc);animation:none;}
.team-card.enter-slide{animation:slideIn .5s cubic-bezier(.22,1,.36,1) both}
.team-card.exit-slide{animation:slideOut .5s cubic-bezier(.55,0,1,.45) both}
.team-card.enter-fade{animation:fadeInC .45s ease both}
.team-card.exit-fade{animation:fadeOutC .45s ease both}
.team-card.enter-flip{animation:flipIn .5s cubic-bezier(.2,1,.6,1) both}
.team-card.exit-flip{animation:flipOut .5s cubic-bezier(.4,0,.8,0) both}

/* scanlines only */
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.022) 2px,rgba(0,0,0,.022) 4px);}

/* ── SCOREBOARD ── */
#scoreboard{position:fixed;top:1.5%;right:1.5%;background:var(--panel);border:1px solid var(--bor);border-radius:12px;padding:10px 14px;z-index:50;animation:breathe 4s ease-in-out infinite,bpulse 4s ease-in-out infinite;transition:opacity .3s;}
#scoreboard.hidden{opacity:0;pointer-events:none;}
.sb-title{font-family:var(--fd);font-size:.5vw;letter-spacing:.2vw;color:rgba(255,255,255,.3);text-transform:uppercase;text-align:center;margin-bottom:8px;}
.sb-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.sb-row:last-child{border-bottom:none;}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sb-name{font-size:.78vw;font-weight:700;}
.sb-heads{display:flex;gap:2px;flex:1;}
.sb-head{width:clamp(13px,1.25vw,19px);height:clamp(13px,1.25vw,19px);border-radius:2px;object-fit:cover;image-rendering:pixelated;opacity:.65;}
.sb-score{font-family:var(--fd);font-size:.85vw;font-weight:900;}
.sb-row.elim .sb-name,.sb-row.elim .sb-score{opacity:.2;text-decoration:line-through;}
.sb-row.first .sb-name{font-weight:900;}

/* ── TOURN PANEL ── */
#tourn-panel{position:fixed;top:1.5%;left:1.5%;background:var(--panel);border:1px solid var(--bor);border-radius:12px;padding:10px 14px;z-index:50;animation:breathe 4s ease-in-out infinite 1s,bpulse 4s ease-in-out infinite 1s;transition:opacity .3s;}
#tourn-panel.hidden{opacity:0;pointer-events:none;}
.tp-inner{transition:opacity .35s;}.tp-inner.fading{opacity:0;}
.tp-title{font-family:var(--fd);font-size:.62vw;font-weight:900;letter-spacing:.18vw;color:var(--acc2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tp-body{font-size:.74vw;font-weight:600;color:rgba(255,255,255,.8);line-height:1.45;white-space:pre-wrap;word-break:break-word;}
.tp-img{width:100%;max-height:70px;object-fit:contain;border-radius:5px;margin-top:5px;}
.tp-dots{display:flex;gap:4px;margin-top:6px;justify-content:center;}
.tp-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.18);}
.tp-dot.on{background:var(--acc);}

/* ── MAIN PANEL ── */
#main-panel{position:fixed;z-index:50;display:flex;flex-direction:column;transition:opacity .3s;transform-origin:bottom left;}
#main-panel.hidden{opacity:0;pointer-events:none;}
#timer-section{background:var(--panel);border:1px solid var(--bor);border-radius:12px 12px 0 0;border-bottom:1px solid rgba(255,255,255,.05);padding:10px 16px 8px;animation:breathe 4s ease-in-out infinite,bpulse 4s ease-in-out infinite;}
.timer-row{display:flex;align-items:center;gap:12px;}
.game-info{display:flex;flex-direction:column;flex-shrink:0;}
.game-num-lbl{font-family:var(--fd);font-size:.75vw;font-weight:900;letter-spacing:.15vw;color:#fff;animation:pulse 3s ease-in-out infinite;}
.game-num-lbl em{color:var(--acc);font-style:normal;}
.stage-lbl{font-family:var(--fd);font-size:.52vw;letter-spacing:.12vw;color:rgba(255,255,255,.45);}
#timer-clock{font-family:var(--fd);font-size:2.8vw;font-weight:900;letter-spacing:.2vw;color:var(--acc2);text-shadow:0 0 18px currentColor;flex:1;text-align:center;}
.phase-info{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;}
#phase-icon{font-size:1.4vw;line-height:1;}
#phase-icon img{width:1.4vw;height:1.4vw;object-fit:contain;display:block;}
#phase-name{font-family:var(--fd);font-size:.58vw;font-weight:700;letter-spacing:.1vw;color:rgba(255,255,255,.7);white-space:nowrap;text-align:center;}
.pbar{width:100%;height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:7px;overflow:hidden;}
#pbar-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:2px;transition:width .8s linear;}
#team-section{background:var(--panel);border:1px solid var(--bor);border-top:none;border-radius:0 0 12px 12px;min-height:130px;position:relative;overflow:hidden;animation:breathe 4s ease-in-out infinite .5s,bpulse 4s ease-in-out infinite .5s;}
#team-stage{position:relative;width:100%;min-height:130px;}
.team-card{position:relative;width:100%;display:flex;align-items:center;gap:14px;padding:14px 18px 14px 14px;will-change:transform,opacity;}
.team-card.exiting{position:absolute;top:0;left:0;}
.tc-bar{width:5px;border-radius:3px;align-self:stretch;flex-shrink:0;min-height:90px;}
.tc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
.tc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
/* BIGGER team name */
.tc-name{font-family:var(--fd);font-weight:900;text-transform:uppercase;font-size:clamp(11px,1.1vw,22px);opacity:.75;white-space:nowrap;}
.tc-badge{display:flex;align-items:center;gap:3px;font-family:var(--fd);font-size:clamp(7px,.5vw,11px);font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0;white-space:nowrap;background:rgba(255,60,60,.18);color:#ff6060;}
.tc-players{display:flex;gap:12px;align-items:flex-start;}
.pu{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0;}
.pu-bust{width:clamp(52px,5vw,78px);height:clamp(64px,6.1vw,95px);border-radius:7px;overflow:hidden;position:relative;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.12);flex-shrink:0;}
.pu-bust img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s;}
.pu.dead .pu-bust img{filter:grayscale(1) brightness(.55);}
.pu.dead .pu-bust{border-color:rgba(200,50,50,.3);}
/* BIGGER player name */
.pu-name{font-size:clamp(9px,.7vw,14px);font-weight:700;color:rgba(255,255,255,.88);width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pu.dead .pu-name{opacity:.4;}
/* BIGGER pts */
.pu-pts{font-family:var(--fd);font-size:clamp(8px,.6vw,12px);color:var(--acc2);font-weight:700;}
/* BIGGER score */
.tc-score{font-family:var(--fd);font-size:clamp(32px,3.8vw,66px);font-weight:900;line-height:1;min-width:60px;text-align:right;text-shadow:0 0 22px currentColor;flex-shrink:0;animation:pulse 3s ease-in-out infinite;}
#cprog{height:3px;background:rgba(255,255,255,.06);overflow:hidden;}
#cprog-fill{height:100%;width:0%;transition:none;}

/* ── TOASTS ── */
#toasts{position:fixed;top:7%;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;}
.toast{background:rgba(4,6,18,.92);border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:7px 18px;font-family:var(--fd);font-size:.65vw;letter-spacing:.15vw;white-space:nowrap;animation:toastIn .35s both;}

/* ── FULLSCREEN TEMPLATE ── */
.fullscreen{position:fixed;inset:0;z-index:100;opacity:0;pointer-events:none;transition:opacity .7s;}
.fullscreen.show{opacity:1;pointer-events:auto;}

/* ── SCREEN BACKGROUNDS (video/image/fallback) ── */
.screen-bg{position:absolute;inset:0;z-index:0;background:#06080f;}
.screen-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;}
.screen-bg-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.5;}

/* ── SUMMARY ── */
#summary-screen{display:flex;flex-direction:column;overflow:hidden;}
#sum-bg{position:absolute;inset:0;z-index:0;}
.sum-content-wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:2.5vh 3.5vw;}
.sum-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.8vh;flex-shrink:0;}
.sum-event{font-family:var(--fd);font-size:.62vw;letter-spacing:.28vw;color:rgba(255,255,255,.32);text-transform:uppercase;}
.sum-mode-title{font-family:var(--fd);font-size:1.05vw;font-weight:900;letter-spacing:.4vw;color:var(--acc2);text-align:center;text-transform:uppercase;text-shadow:0 0 20px currentColor;animation:glowPulse 3s ease-in-out infinite;}
.sum-game{font-family:var(--fd);font-size:.62vw;letter-spacing:.2vw;color:rgba(255,255,255,.32);}
#sum-content{flex:1;position:relative;overflow:hidden;}
.sum-slide{position:absolute;inset:0;opacity:0;transition:opacity .45s;display:flex;flex-direction:column;}
.sum-slide.show{opacity:1;}
.sum-team-banner{display:flex;align-items:center;gap:1.5vw;padding:1.5vh 2vw;border-radius:12px;margin-bottom:1.8vh;flex-shrink:0;}
.sum-team-bar{width:6px;border-radius:3px;align-self:stretch;min-height:32px;flex-shrink:0;}
.sum-team-name{font-family:var(--fd);font-size:1.6vw;font-weight:900;letter-spacing:.28vw;}
.sum-team-score{font-family:var(--fd);font-size:2.8vw;font-weight:900;margin-left:auto;text-shadow:0 0 20px currentColor;animation:pulse 2.5s ease-in-out infinite;}
.sum-players-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5vw;flex:1;align-content:start;}
.sum-pcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:1.5vh 1vw;display:flex;flex-direction:column;align-items:center;gap:.6vh;animation:breathe 4s ease-in-out infinite;}
.sum-pcard-img{width:clamp(54px,5vw,80px);height:auto;border-radius:7px;object-fit:cover;}
.sum-pcard-name{font-size:clamp(11px,.9vw,16px);font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.sum-pcard-stats{display:flex;gap:.5vw;flex-wrap:wrap;justify-content:center;margin-top:.2vh;}
.sum-stat{font-family:var(--fd);font-size:clamp(7px,.55vw,10px);color:rgba(255,255,255,.5);white-space:nowrap;}
.sum-stat strong{color:#fff;}
.sum-pcard.dead .sum-pcard-img{filter:grayscale(1) brightness(.5);}
.top3-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;}
.top3-grid{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:2vw;align-items:end;}
.top3-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:2.5vh 1.5vw;display:flex;flex-direction:column;align-items:center;gap:.8vh;animation:breathe 4s ease-in-out infinite;}
.top3-card:nth-child(1){border-color:rgba(255,224,51,.35);animation-delay:.5s;}
.top3-card:nth-child(2){border-color:rgba(255,224,51,.45);padding:3.5vh 2vw;}
.top3-card:nth-child(3){border-color:rgba(205,127,50,.35);animation-delay:1s;}
.top3-rank{font-family:var(--fd);font-size:2vw;font-weight:900;}
.top3-av{width:clamp(60px,6vw,96px);border-radius:8px;object-fit:cover;}
.top3-name{font-size:clamp(12px,1.1vw,18px);font-weight:900;text-align:center;}
.top3-team{font-size:clamp(9px,.65vw,12px);font-weight:700;opacity:.6;}
.top3-pts{font-family:var(--fd);font-size:clamp(20px,2vw,34px);font-weight:900;text-shadow:0 0 16px currentColor;animation:glowPulse 3s ease-in-out infinite;}
.top3-stats{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;margin-top:.3vh;}
.sum-nav{display:flex;justify-content:center;gap:7px;margin-top:1.5vh;flex-shrink:0;}
.sum-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s;}
.sum-dot.on{background:var(--acc);transform:scale(1.4);}

/* ── MAP SCREEN ── */
#map-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
#map-bg{position:absolute;inset:0;z-index:0;}
.map-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;}
.map-lbl{font-family:var(--fd);font-size:.9vw;font-weight:900;letter-spacing:.5vw;color:rgba(255,255,255,.32);text-transform:uppercase;margin-bottom:2.5vh;animation:fadeUp .5s ease both;}
#map-window{width:60vw;height:38vh;border:2px solid var(--acc);border-radius:14px;overflow:hidden;box-shadow:0 0 60px var(--glow);position:relative;animation:breathe 4s ease-in-out infinite;}
#map-strip{position:absolute;top:0;left:0;width:100%;}
.map-slide{width:100%;position:absolute;left:0;}
.map-slide img{width:100%;height:100%;object-fit:cover;display:block;}
.map-slide-name{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(4,6,16,.94));padding:2vh 2vw;font-family:var(--fd);font-size:2.4vw;font-weight:900;color:#fff;text-shadow:0 0 20px currentColor;}
.map-no-img{width:100%;height:100%;background:#111;display:flex;align-items:center;justify-content:center;font-size:3vw;color:#333;}
#map-result{margin-top:2.5vh;font-family:var(--fd);font-size:1.7vw;font-weight:900;letter-spacing:.4vw;color:var(--acc2);text-shadow:0 0 24px currentColor;text-align:center;opacity:0;transition:opacity .5s;}
#map-result.show{opacity:1;animation:glowPulse 2s ease-in-out infinite;}
#map-game-tag{font-family:var(--fd);font-size:.78vw;letter-spacing:.35vw;color:rgba(255,255,255,.38);margin-top:.7vh;text-align:center;}

/* ── STARTING / BRB SCREENS ── */
.logo-screen{display:flex;flex-direction:column;overflow:hidden;}
.ls-bg{position:absolute;inset:0;z-index:0;}
.ls-bg-img{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;}
.ls-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:4vh 6vw;gap:0;}
.logo-wrap{display:flex;align-items:center;justify-content:center;max-width:40vw;max-height:32vh;margin-bottom:3.5vh;}
.logo-wrap .logo-img{max-width:100%;max-height:32vh;object-fit:contain;}
.ls-event{font-family:var(--fd);font-size:1.9vw;font-weight:900;letter-spacing:.5vw;text-transform:uppercase;color:var(--acc2);margin-bottom:1.2vh;text-align:center;text-shadow:0 0 28px var(--acc);}
.ls-subtitle{font-family:var(--fd);font-size:.88vw;font-weight:700;letter-spacing:.4vw;text-transform:uppercase;color:rgba(255,255,255,.48);margin-bottom:2.5vh;text-align:center;}
.ls-line{width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.3;margin:1.8vh 0;}
.ls-teams-strip{display:flex;gap:1.5vw;flex-wrap:wrap;justify-content:center;margin-bottom:2vh;}
.ls-team-chip{display:flex;align-items:center;gap:.7vw;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:.5vh 1.2vw;animation:breathe 4s ease-in-out infinite;}
.ls-team-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.ls-team-name{font-family:var(--fd);font-size:.65vw;font-weight:700;letter-spacing:.1vw;}
.ls-timer{font-family:var(--fd);font-size:4.2vw;font-weight:900;letter-spacing:.3vw;color:var(--acc2);text-shadow:0 0 28px var(--acc);animation:glowPulse 2s ease-in-out infinite;}
.ls-timer-label{font-family:var(--fd);font-size:.58vw;letter-spacing:.3vw;color:rgba(255,255,255,.28);margin-top:.4vh;text-align:center;}

/* ── CHAT ── */
#chat-panel{position:fixed;z-index:60;background:rgba(5,8,20,.88);border:1px solid rgba(255,255,255,.1);border-radius:10px;overflow:hidden;transition:opacity .3s;display:flex;flex-direction:column;backdrop-filter:blur(10px);}
#chat-panel.hidden{opacity:0;pointer-events:none;}
.chat-title{font-family:var(--fd);font-size:.55vw;font-weight:700;letter-spacing:.2vw;color:var(--acc2);padding:7px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;}
#chat-iframe-wrap{flex:1;overflow:hidden;}
#chat-iframe-wrap iframe{width:100%;height:100%;border:none;background:transparent;}
</style>
</head>
<body>
<div id="scanlines"></div>

<div id="scoreboard"><div class="sb-title">Standings</div><div id="sb-rows"></div></div>
<div id="tourn-panel"><div class="tp-inner" id="tp-inner"><div class="tp-title" id="tp-title"></div><div class="tp-body" id="tp-body"></div><img class="tp-img" id="tp-img" style="display:none" alt=""/></div><div class="tp-dots" id="tp-dots"></div></div>

<div id="main-panel">
  <div id="timer-section">
    <div class="timer-row">
      <div class="game-info">

<script>
'use strict';
var G=window.BWO, ST=G.state, TC=G.TC;
function gid(id){return document.getElementById(id);}
function bustURL(n){return'https://visage.surgeplay.com/bust/256/'+encodeURIComponent(n.trim());}
function fullURL(n){return'https://visage.surgeplay.com/full/256/'+encodeURIComponent(n.trim());}
function fallURL(n){return'https://mc-heads.net/avatar/'+encodeURIComponent(n.trim())+'/64';}

/* ── THEME ── */
function hexToRgba(hex,a){try{var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgba('+r+','+g+','+b+','+a+')';}catch(e){return'rgba(0,0,0,'+a+')';}}
function getAccents(st){
  var p={blue:['#4488ff','#00e5ff'],red:['#ff4040','#ff8080'],green:['#40ff80','#00ffcc'],gold:['#ffcc00','#ffaa00'],purple:['#aa44ff','#cc88ff'],off:['#fff','#ccc']};
  if(st.theme==='custom')return[st.customAccent||'#4488ff',st.customAccent2||G.deriveAccent2(st.customAccent||'#4488ff')];
  return p[st.theme]||p.blue;
}
function applyTheme(st){
  var ac=getAccents(st),acc=ac[0],acc2=ac[1];
  var r=document.documentElement.style;
  r.setProperty('--acc',acc);r.setProperty('--acc2',acc2);
  r.setProperty('--glow',hexToRgba(acc,.22));r.setProperty('--b1',hexToRgba(acc,.12));r.setProperty('--b2',hexToRgba(acc2,.06));
}

/* ── VIDEO / IMAGE BACKGROUNDS ── */
function setVideoBg(screenId, videoUrl, imgUrl) {
  var vid = gid(screenId+'-video');
  var img = gid(screenId+'-bg-img');
  if (vid) {
    if (videoUrl && vid.dataset.src !== videoUrl) {
      vid.dataset.src = videoUrl;
      vid.src = videoUrl;
      vid.load();
    } else if (!videoUrl) {
      vid.src = '';
      vid.dataset.src = '';
    }
  }
  if (img) {
    img.style.backgroundImage = imgUrl ? 'url('+imgUrl+')' : 'none';
  }
}
function updateAllBgs(st) {
  var shared = st.sharedBgVideoUrl || '';
  var sharedImg = st.sharedBgImageUrl || '';
  setVideoBg('starting', st.startingBgVideoUrl || shared, st.startingBgImageUrl || sharedImg);
  setVideoBg('brb',      st.brbBgVideoUrl      || shared, st.brbBgImageUrl      || sharedImg);
  setVideoBg('sum',      st.sumBgVideoUrl       || shared, st.sumBgImageUrl      || sharedImg);
  setVideoBg('map',      st.mapBgVideoUrl       || shared, st.mapBgImageUrl      || sharedImg);
}

function applyLayout(st){

  if(mp){mp.style.left=(st.mainPanelLeft||60)+'px';mp.style.bottom=(st.mainPanelBottom||80)+'px';mp.style.top='auto';mp.style.transform='scale('+(st.mainPanelScale||1)+')';mp.style.width=(st.mainPanelW||900)+'px';}
  var sb=gid('scoreboard');
  if(sb){if(st.sbLeft!=null){sb.style.left=st.sbLeft+'px';sb.style.right='auto';}else{sb.style.left='';sb.style.right='1.5%';}if(st.sbTop!=null)sb.style.top=st.sbTop+'px';else sb.style.top='1.5%';sb.style.transform='scale('+(st.sbScale||1)+')';sb.style.transformOrigin='top right';if(st.sbW)sb.style.width=st.sbW+'px';}
  var tp=gid('tourn-panel');
  if(tp){if(st.tpLeft!=null)tp.style.left=st.tpLeft+'px';else tp.style.left='1.5%';if(st.tpTop!=null)tp.style.top=st.tpTop+'px';else tp.style.top='1.5%';if(st.tpW)tp.style.width=st.tpW+'px';}
  var cp=gid('chat-panel');
  if(cp){cp.style.left=(st.chatLeft||20)+'px';cp.style.top=(st.chatTop||200)+'px';cp.style.width=(st.chatW||320)+'px';cp.style.height=(st.chatH||400)+'px';cp.style.transform='scale('+(st.chatScale||1)+')';cp.style.transformOrigin='top left';cp.classList.toggle('hidden',!st.showChat);}
}

function renderSB(st){
  var rows=gid('sb-rows');if(!rows)return;
  var active=(st.teams||[]).filter(function(t){return(t.players||[]).some(function(p){return G.getPlayerName(p).trim();});});
  var sorted=active.slice().sort(function(a,b){return(st.scores[b.color]||0)-(st.scores[a.color]||0);});
  rows.innerHTML='';
  sorted.forEach(function(t,i){
    var c=TC[t.color]||'#fff';
    var players=(t.players||[]).filter(function(p){return G.getPlayerName(p).trim();});
    var headsHtml=players.slice(0,4).map(function(p){
      var name=G.getPlayerName(p);
      var dead=G.isPlayerDead(p);
      return'<img class="sb-head" src="https://mc-heads.net/avatar/'+encodeURIComponent(name)+'/20" alt="'+name+'" style="'+(dead?'filter:grayscale(1) opacity(.4)':'')+'" onerror="this.style.display=\'none\'"/>';
    }).join('');
    var r=document.createElement('div');
    r.className='sb-row'+(t.eliminated?' elim':'')+(i===0&&!t.eliminated?' first':'');
    r.innerHTML='<div class="sb-dot" style="background:'+c+';box-shadow:0 0 5px '+c+'99"></div>'+
      '<div class="sb-name" style="color:'+c+'">'+t.color+'</div>'+
      '<div class="sb-heads">'+headsHtml+'</div>'+
      '<div class="sb-score" style="color:'+c+'">'+(st.scores[t.color]||0)+'</div>';
    rows.appendChild(r);
  });
  gid('scoreboard').classList.toggle('hidden',!st.showScoreboard);
}

var timerRAF=null;
function updateTimerDOM(st){
  var ck=gid('timer-clock');if(!ck)return;
  if(!st.timerStarted){ck.textContent='PREGAME';gid('phase-name').textContent='Pregame';gid('phase-icon').innerHTML='⏸';gid('pbar-fill').style.width='100%';return;}
  var e=G.getElapsed(st),res=G.getPhase(e),ph=res.phase,pe=res.phaseElapsed;
  ck.textContent=G.fmt(Math.max(0,ph.duration-pe));
  gid('pbar-fill').style.width=Math.max(0,100-(pe/ph.duration*100))+'%';
  gid('phase-name').textContent=ph.name;
  var ico=gid('phase-icon'),custom=(st.phaseIcons||{})[ph.icon];
  if(custom)ico.innerHTML='<img src="'+custom+'" style="width:1.4vw;height:1.4vw;object-fit:contain"/>';
  else{var em={diamond:'◆',emerald:'◈',bed:'🛏',skull:'☠'};ico.innerHTML=em[ph.icon]||'▶';}
}
function tickTimer(){updateTimerDOM(ST.get());timerRAF=requestAnimationFrame(tickTimer);}

var startingRAF=null;
function tickStarting(){
  var st=ST.get(),e=G.getStartingElapsed(st);
  var countFrom=st.startingCountdownFrom||0;
  var display=countFrom>0?Math.max(0,countFrom-e):e;
  var el=gid('starting-timer');if(el)el.textContent=G.fmt(display);
  var lbl=gid('starting-timer-label');if(lbl)lbl.textContent=countFrom>0?'STARTING IN':'TIME ELAPSED';
  startingRAF=requestAnimationFrame(tickStarting);
}

var activeCard=null,curIdx=0,cycleTO=null,cycleRAF=null,cycleStart=null;
function getActiveTeams(st){return(st.teams||[]).filter(function(t){return(t.players||[]).some(function(p){return G.getPlayerName(p).trim();});});}
function buildCard(team,st){
  var c=TC[team.color]||'#fff';
  var players=(team.players||[]).filter(function(p){return G.getPlayerName(p).trim();});
  var card=document.createElement('div');card.className='team-card';
  card.style.borderColor=c+'28';card.style.boxShadow='0 0 30px '+c+'12,inset 0 0 30px '+c+'05';
  var bedOK=team.hasBed!==false;
  var bedIcon=((st.phaseIcons||{}).bedgone)?'<img src="'+(st.phaseIcons.bedgone)+'" style="width:12px;height:12px;object-fit:contain"/>':'💔';
  var badges=!bedOK?'<div class="tc-badge">'+bedIcon+' BED GONE</div>':'';
  var pHtml=players.slice(0,4).map(function(p){
    var name=G.getPlayerName(p),dead=G.isPlayerDead(p);
    var pts=((st.playerStats||{})[name]||{}).points||0;
    return'<div class="pu'+(dead?' dead':'')+'"><div class="pu-bust"><img src="'+bustURL(name)+'" onerror="this.src=\''+fallURL(name)+'\'" loading="eager" alt="'+name+'"/></div><div class="pu-name" title="'+name+'">'+name+'</div>'+(pts>0?'<div class="pu-pts">'+pts+'pts</div>':'')+' </div>';
  }).join('');
  card.innerHTML='<div class="tc-bar" style="background:'+c+';box-shadow:0 0 12px '+c+'"></div><div class="tc-body"><div class="tc-top"><div class="tc-name" style="color:'+c+'">'+team.color+' Team</div>'+badges+'</div><div class="tc-players">'+pHtml+'</div></div><div class="tc-score" style="color:'+c+'">'+(st.scores[team.color]||0)+'</div>';
  return card;
}
function startCycleProgress(dur,color){
  if(cycleRAF)cancelAnimationFrame(cycleRAF);
  var fill=gid('cprog-fill');if(!fill)return;
  fill.style.background=color||'var(--acc)';fill.style.width='0%';cycleStart=Date.now();
  function tick(){var p=Math.min(100,(Date.now()-cycleStart)/(dur*1000)*100);fill.style.width=p+'%';if(p<100)cycleRAF=requestAnimationFrame(tick);}
  cycleRAF=requestAnimationFrame(tick);
}
function cycleTo(nextIdx,st){
  clearTimeout(cycleTO);var teams=getActiveTeams(st);if(!teams.length)return;
  nextIdx=((nextIdx%teams.length)+teams.length)%teams.length;
  var team=teams[nextIdx],tr=st.transition||'slide',stage=gid('team-stage');
  if(activeCard){var dying=activeCard;dying.classList.add('exiting');dying.classList.remove('enter-'+tr);dying.classList.add('exit-'+tr);setTimeout(function(){if(dying.parentNode)dying.parentNode.removeChild(dying);},560);activeCard=null;}
  var card=buildCard(team,st);card.classList.add('enter-'+tr);stage.appendChild(card);
  requestAnimationFrame(function(){if(card.parentNode)stage.style.minHeight=card.offsetHeight+'px';});
  activeCard=card;curIdx=nextIdx;
  startCycleProgress(st.cycleInterval||8,TC[team.color]||'#fff');
  if(st.autoCycle!==false&&teams.length>1){cycleTO=setTimeout(function(){var s=ST.get();if(!s.showTeams)return;var at=getActiveTeams(s);if(!at.length)return;cycleTo((curIdx+1)%at.length,s);},(st.cycleInterval||8)*1000);}
}

var tpIdx=0,tpTO=null;
function showTournCard(cards,idx){
  if(!cards||!cards.length){gid('tourn-panel').classList.add('hidden');return;}
  gid('tourn-panel').classList.remove('hidden');
  var card=cards[idx]||cards[0],inner=gid('tp-inner');
  inner.classList.add('fading');
  setTimeout(function(){
    gid('tp-title').textContent=card.title||'';gid('tp-body').textContent=card.body||'';
    var img=gid('tp-img');if(card.imageUrl){img.src=card.imageUrl;img.style.display='';}else img.style.display='none';
    var dots=gid('tp-dots');dots.innerHTML='';cards.forEach(function(_,i){var d=document.createElement('div');d.className='tp-dot'+(i===idx?' on':'');dots.appendChild(d);});
    inner.classList.remove('fading');
  },360);
}
function runTournCycle(st){
  clearTimeout(tpTO);var cards=st.tournCards||[];
  if(!st.showTournInfo||!cards.length){gid('tourn-panel').classList.add('hidden');return;}
  showTournCard(cards,tpIdx);
  if(cards.length>1){tpTO=setTimeout(function(){tpIdx=(tpIdx+1)%(ST.get().tournCards||[]).length;runTournCycle(ST.get());},(st.tournCardInterval||10)*1000);}
}

var sumSlides=[],sumIdx=0,sumTO=null;
function buildSummarySlides(st){
  sumSlides=[];
  var stats=st.playerStats||{};
  getActiveTeams(st).forEach(function(team){sumSlides.push({type:'team',team:team});});
  var all=[];
  (st.teams||[]).forEach(function(team){(team.players||[]).forEach(function(p){var name=G.getPlayerName(p);if(!name.trim())return;var s=stats[name]||{};all.push({name:name,color:team.color,dead:G.isPlayerDead(p),points:s.points||0,kills:s.kills||0,deaths:s.deaths||0,finals:s.finals||0,bedbreaks:s.bedbreaks||0,kdr:s.kdr||0});});});
  all.sort(function(a,b){return b.points-a.points;});
  if(all.length)sumSlides.push({type:'top',players:all.slice(0,3)});
}
function renderSumSlide(st,idx){
  var cont=gid('sum-content');if(!cont)return;
  // Remove ALL slides (not just .show) — this is what caused the overlap
  var allSlides=cont.querySelectorAll('.sum-slide');
  allSlides.forEach(function(s){
    if(s.classList.contains('show')){
      s.style.transition='opacity .35s';s.style.opacity='0';
      setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},380);
    } else {
      s.parentNode.removeChild(s);
    }
  });
  var nav=gid('sum-nav');nav.innerHTML='';
  sumSlides.forEach(function(_,i){var d=document.createElement('div');d.className='sum-dot'+(i===idx?' on':'');nav.appendChild(d);});
  var slide=sumSlides[idx];if(!slide)return;
  var div=document.createElement('div');div.className='sum-slide';
  var stats=st.playerStats||{};
  if(slide.type==='team'){
    var t=slide.team,c=TC[t.color]||'#fff';
    gid('sum-title').textContent=t.color+' Team';
    var bannerStyle='background:linear-gradient(135deg,'+hexToRgba(c,.10)+','+hexToRgba(c,.04)+');border:1px solid '+hexToRgba(c,.22)+';';
    var players=(t.players||[]).filter(function(p){return G.getPlayerName(p).trim();}).slice(0,4);
    while(players.length<4)players.push(null);
    var pCards=players.map(function(p){
      if(!p)return'<div class="sum-pcard" style="opacity:.15;border-color:rgba(255,255,255,.04);"></div>';
      var name=G.getPlayerName(p),dead=G.isPlayerDead(p),s=stats[name]||{};
      return'<div class="sum-pcard'+(dead?' dead':'')+'" style="border-color:'+hexToRgba(c,.22)+'"><img class="sum-pcard-img" src="'+bustURL(name)+'" onerror="this.src=\''+fallURL(name)+'\'" loading="lazy"/><div class="sum-pcard-name" style="color:'+c+'">'+name+'</div><div class="sum-pcard-stats"><span class="sum-stat"><strong style="color:'+c+'">'+(s.points||0)+'</strong>pts</span><span class="sum-stat"><strong>'+(s.kills||0)+'</strong>K</span><span class="sum-stat"><strong>'+(s.deaths||0)+'</strong>D</span><span class="sum-stat"><strong>'+(s.finals||0)+'</strong>FK</span><span class="sum-stat"><strong>'+(s.bedbreaks||0)+'</strong>BB</span></div></div>';
    }).join('');
    div.innerHTML='<div class="sum-team-banner" style="'+bannerStyle+'"><div class="sum-team-bar" style="background:'+c+';box-shadow:0 0 10px '+c+'"></div><div class="sum-team-name" style="color:'+c+'">'+t.color+' Team</div><div class="sum-team-score" style="color:'+c+'">'+(st.scores[t.color]||0)+' pts</div></div><div class="sum-players-row">'+pCards+'</div>';
  } else {
    gid('sum-title').textContent='Top Players';
    var rnkC=['#ffe033','#aaaaaa','#cd7f32'],rnkL=['🥇','🥈','🥉'];
    var cards=slide.players.map(function(p,i){var c=TC[p.color]||'#fff';return'<div class="top3-card" style="border-color:'+hexToRgba(c,.35)+'"><div class="top3-rank" style="color:'+rnkC[i]+'">'+rnkL[i]+'</div><img class="top3-av" src="'+fullURL(p.name)+'" onerror="this.src=\''+fallURL(p.name)+'\'" loading="lazy" style="'+(p.dead?'filter:grayscale(1) brightness(.5)':'')+'"/><div class="top3-name">'+p.name+'</div><div class="top3-team" style="color:'+c+'">'+p.color+'</div><div class="top3-pts" style="color:'+c+'">'+p.points+' pts</div><div class="top3-stats"><span class="sum-stat"><strong>'+p.kills+'</strong>K</span><span class="sum-stat"><strong>'+p.finals+'</strong>FK</span><span class="sum-stat"><strong>'+p.bedbreaks+'</strong>BB</span><span class="sum-stat"><strong>'+p.deaths+'</strong>D</span>'+(p.kdr?'<span class="sum-stat"><strong>'+parseFloat(p.kdr).toFixed(2)+'</strong>KDR</span>':'')+'</div></div>';}).join('');
    div.innerHTML='<div class="top3-wrap"><div class="top3-grid">'+cards+'</div></div>';
  }
  cont.appendChild(div);
  requestAnimationFrame(function(){div.classList.add('show');});
  clearTimeout(sumTO);sumTO=setTimeout(function(){sumIdx=(sumIdx+1)%sumSlides.length;renderSumSlide(ST.get(),sumIdx);},8000);
}

function makeMapSlide(m,h){var s=document.createElement('div');s.className='map-slide';s.style.height=h+'px';s.innerHTML=(m.imageUrl?'<img src="'+m.imageUrl+'" alt="'+m.name+'" style="width:100%;height:100%;object-fit:cover;display:block"/>':'<div class="map-no-img">🗺️</div>')+'<div class="map-slide-name">'+m.name+'</div>';return s;}
function showMapResult(tm,st){setTimeout(function(){var r=gid('map-result');r.textContent='SELECTED: '+tm.name.toUpperCase();r.classList.add('show');gid('map-game-tag').textContent='Game '+(st.gameNumber||1)+(st.gameStage?' · '+st.gameStage:'');},300);}
function runMapReveal(st){var pool=st.mapPool||[];if(!pool.length)return;var tm=pool.find(function(m){return m.name===st.selectedMap;})||pool[0];gid('map-result').classList.remove('show');gid('map-result').textContent='';gid('map-game-tag').textContent='';var tr=st.mapTransition||'slot';if(tr==='fade')runMapFade(pool,tm,st);else if(tr==='flip')runMapFlip(pool,tm,st);else if(tr==='roulette')runMapRoulette(pool,tm,st);else if(tr==='glitch')runMapGlitch(pool,tm,st);else runMapSlot(pool,tm,st);}
function runMapSlot(pool,tm,st){var strip=gid('map-strip'),win=gid('map-window'),h=win.offsetHeight||300;strip.innerHTML='';strip.style.display='block';strip.style.width='100%';strip.style.transform='';var slides=[];for(var j=0;j<22;j++)slides.push(pool[Math.floor(Math.random()*pool.length)]);slides.push(tm);slides.forEach(function(m,i){var s=makeMapSlide(m,h);s.style.top=(i*h)+'px';strip.appendChild(s);});strip.style.height=(slides.length*h)+'px';var td=4000,st2=null,ty=-(slides.length-1)*h;function eOut(t){return 1-Math.pow(1-t,3);}function frame(ts){if(!st2)st2=ts;var p=Math.min(1,(ts-st2)/td);strip.style.top=(eOut(p)*ty)+'px';if(p<1)requestAnimationFrame(frame);else showMapResult(tm,st);}requestAnimationFrame(frame);}
function runMapFade(pool,tm,st){var strip=gid('map-strip'),win=gid('map-window'),h=win.offsetHeight||300;strip.innerHTML='';strip.style.height=h+'px';strip.style.display='block';strip.style.transform='';var seq=pool.slice().sort(function(){return Math.random()-.5;}).slice(0,6);seq.push(tm);var sl=makeMapSlide(seq[0],h);sl.style.top='0';sl.style.transition='opacity .5s';strip.appendChild(sl);var i=1;function next(){if(i>=seq.length){showMapResult(tm,st);return;}sl.style.opacity='0';setTimeout(function(){var ns=makeMapSlide(seq[i],h);ns.style.top='0';ns.style.opacity='0';ns.style.transition='opacity .5s';strip.innerHTML='';strip.appendChild(ns);requestAnimationFrame(function(){ns.style.opacity='1';sl=ns;});i++;setTimeout(next,i<seq.length?700:1200);},500);}setTimeout(next,700);}
function runMapFlip(pool,tm,st){var strip=gid('map-strip'),win=gid('map-window'),h=win.offsetHeight||300;strip.innerHTML='';strip.style.height=h+'px';strip.style.display='block';strip.style.transform='';var seq=pool.slice().sort(function(){return Math.random()-.5;}).slice(0,7);seq.push(tm);var sl=makeMapSlide(seq[0],h);sl.style.top='0';sl.style.transformOrigin='center';sl.style.transition='transform .4s';strip.appendChild(sl);var i=1;function next(){if(i>=seq.length){showMapResult(tm,st);return;}sl.style.transform='rotateX(90deg)';setTimeout(function(){var ns=makeMapSlide(seq[i],h);ns.style.top='0';ns.style.transformOrigin='center';ns.style.transform='rotateX(-90deg)';ns.style.transition='transform .4s';strip.innerHTML='';strip.appendChild(ns);requestAnimationFrame(function(){requestAnimationFrame(function(){ns.style.transform='rotateX(0deg)';sl=ns;});});i++;setTimeout(next,750);},400);}setTimeout(next,700);}
function runMapRoulette(pool,tm,st){var strip=gid('map-strip'),win=gid('map-window'),h=win.offsetHeight||300,w=win.offsetWidth||600;strip.innerHTML='';strip.style.display='flex';strip.style.height=h+'px';strip.style.top='0';var slides=[];for(var j=0;j<18;j++)slides.push(pool[Math.floor(Math.random()*pool.length)]);slides.push(tm);strip.style.width=(slides.length*w)+'px';strip.style.transform='translateX(0)';slides.forEach(function(m){var s=makeMapSlide(m,h);s.style.position='relative';s.style.width=w+'px';s.style.flex='0 0 '+w+'px';strip.appendChild(s);});var td=4200,st2=null,tx=-(slides.length-1)*w;function eOut(t){return 1-Math.pow(1-t,3);}function frame(ts){if(!st2)st2=ts;var p=Math.min(1,(ts-st2)/td);strip.style.transform='translateX('+(eOut(p)*tx)+'px)';if(p<1)requestAnimationFrame(frame);else showMapResult(tm,st);}requestAnimationFrame(frame);}
function runMapGlitch(pool,tm,st){var strip=gid('map-strip'),win=gid('map-window'),h=win.offsetHeight||300;strip.innerHTML='';strip.style.display='block';strip.style.height=h+'px';strip.style.top='0';strip.style.transform='';var count=0,total=22,delay=50;function glitch(){if(count>=total){var fin=makeMapSlide(tm,h);fin.style.top='0';strip.innerHTML='';strip.appendChild(fin);showMapResult(tm,st);return;}var m=pool[Math.floor(Math.random()*pool.length)],ns=makeMapSlide(m,h);ns.style.top='0';var cy=Math.floor(Math.random()*80),ch=20+Math.floor(Math.random()*60);ns.style.clipPath='inset('+cy+'% 0 '+(100-cy-ch)+'% 0)';strip.innerHTML='';strip.appendChild(ns);count++;delay=Math.min(delay+10,260);setTimeout(glitch,delay);}glitch();}

function applyTextAnim(el,animName){if(!el)return;el.className=el.className.replace(/text-\w+/g,'').trim();if(animName&&animName!=='none')el.classList.add('text-'+animName);}

function updateLogoScreens(st){
  updateAllBgs(st);
  // Starting logo
  var sl=gid('starting-logo'),sw=gid('starting-logo-wrap');
  if(sl){if(st.startingLogoUrl){sl.src=st.startingLogoUrl;sl.style.display='';}else sl.style.display='none';}
  if(sw)sw.className='logo-wrap anim-'+(st.startingAnimation||'pulse');
  var ev=gid('starting-event'),sub=gid('starting-subtitle');
  if(ev){ev.textContent=st.startingEventName||'';applyTextAnim(ev,st.startingTextAnim||'shimmer');}
  if(sub)sub.textContent=st.startingSubtext||'Starting Soon';
  // Team chips
  var ts=gid('starting-teams');
  if(ts){var active=(st.teams||[]).filter(function(t){return(t.players||[]).some(function(p){return G.getPlayerName(p).trim();});});ts.innerHTML=active.map(function(t){var c=TC[t.color]||'#fff';return'<div class="ls-team-chip" style="border-color:'+hexToRgba(c,.28)+'"><div class="ls-team-dot" style="background:'+c+';box-shadow:0 0 6px '+c+'"></div><div class="ls-team-name" style="color:'+c+'">'+t.color+'</div></div>';}).join('');}
  // BRB
  var bl=gid('brb-logo'),bw=gid('brb-logo-wrap'),bev=gid('brb-event'),bsub=gid('brb-subtitle');
  if(bl){if(st.brbLogoUrl){bl.src=st.brbLogoUrl;bl.style.display='';}else bl.style.display='none';}
  if(bw)bw.className='logo-wrap anim-'+(st.brbAnimation||'float');
  if(bev){bev.textContent=st.brbEventName||st.startingEventName||'';applyTextAnim(bev,st.brbTextAnim||'fade');}
  if(bsub)bsub.textContent=st.brbSubtext||'Be Right Back';
}

var prevMode='';
function render(st){
  applyTheme(st);applyLayout(st);
  gid('gnum').textContent=st.gameNumber||1;gid('map-tag').textContent=st.mapName?'— '+st.mapName:'';gid('stage-lbl').textContent=st.gameStage||'';
  if(st.timerRunning){if(!timerRAF)timerRAF=requestAnimationFrame(tickTimer);}else{if(timerRAF){cancelAnimationFrame(timerRAF);timerRAF=null;}updateTimerDOM(st);}
  if(st.startingTimerRunning){if(!startingRAF)startingRAF=requestAnimationFrame(tickStarting);}else{if(startingRAF){cancelAnimationFrame(startingRAF);startingRAF=null;}var etl=gid('starting-timer');if(etl){var e2=G.getStartingElapsed(st),cf=st.startingCountdownFrom||0;etl.textContent=G.fmt(cf>0?Math.max(0,cf-e2):e2);}}
  renderSB(st);
  var sig=teamSig(st);if(sig!==lastSig){lastSig=sig;if(activeCard){if(activeCard.parentNode)activeCard.parentNode.removeChild(activeCard);activeCard=null;}clearTimeout(cycleTO);var at=getActiveTeams(st);if(curIdx>=at.length)curIdx=0;if(st.showTeams&&at.length>0)cycleTo(curIdx,st);}
  var tc=JSON.stringify(st.tournCards);if(tc!==lastTC){lastTC=tc;tpIdx=0;runTournCycle(st);}else gid('tourn-panel').classList.toggle('hidden',!st.showTournInfo);
  updateLogoScreens(st);updateChat(st);setMode(st.overlayMode||'starting',st);checkToasts(st);
}

var prevMode='';
function setMode(mode,st){
  if(mode===prevMode)return;
  var screens=['summary-screen','map-screen','starting-screen','brb-screen'];
  var gameEls=['scoreboard','main-panel','tourn-panel'];
  screens.forEach(function(id){var el=gid(id);if(el)el.classList.remove('show');});
  gameEls.forEach(function(id){var el=gid(id);if(el)el.classList.remove('hidden');});
  if(mode==='summary'){gameEls.forEach(function(id){var el=gid(id);if(el)el.classList.add('hidden');});buildSummarySlides(st);sumIdx=0;gid('sum-event-lbl').textContent=st.startingEventName||'';gid('sum-game-lbl').textContent='Game '+(st.gameNumber||1)+(st.gameStage?' · '+st.gameStage:'');var s=gid('summary-screen');setTimeout(function(){s.classList.add('show');renderSumSlide(st,0);},50);}
  else if(mode==='map'){gameEls.forEach(function(id){var el=gid(id);if(el)el.classList.add('hidden');});var s=gid('map-screen');setTimeout(function(){s.classList.add('show');setTimeout(function(){runMapReveal(ST.get());},500);},50);}
  else if(mode==='starting'){gameEls.forEach(function(id){var el=gid(id);if(el)el.classList.add('hidden');});gid('starting-screen').classList.add('show');if(st.startingTimerRunning&&!startingRAF)startingRAF=requestAnimationFrame(tickStarting);}
  else if(mode==='brb'){gameEls.forEach(function(id){var el=gid(id);if(el)el.classList.add('hidden');});gid('brb-screen').classList.add('show');}
  else{gid('scoreboard').classList.toggle('hidden',!st.showScoreboard);gid('main-panel').classList.toggle('hidden',!st.showTeams&&!st.showTimer);gid('tourn-panel').classList.toggle('hidden',!st.showTournInfo);}
  prevMode=mode;
}

var lastChatUrl='';
function updateChat(st){var cp=gid('chat-panel');if(!cp)return;cp.classList.toggle('hidden',!st.showChat);if(st.showChat&&st.chatStreamUrl&&st.chatStreamUrl!==lastChatUrl){lastChatUrl=st.chatStreamUrl;var url=st.chatStreamUrl.trim(),embedUrl='';var tm=url.match(/twitch\.tv\/([^\/?\s]+)/i);if(tm)embedUrl='https://www.twitch.tv/embed/'+tm[1]+'/chat?parent='+location.hostname+'&darkpopout';var ym=url.match(/youtube\.com\/watch\?v=([^&\s]+)/i)||url.match(/youtu\.be\/([^\/?\s]+)/i)||url.match(/youtube\.com\/live\/([^\/?\s]+)/i);if(ym)embedUrl='https://www.youtube.com/live_chat?v='+ym[1]+'&embed_domain='+location.hostname;if(embedUrl){var wrap=gid('chat-iframe-wrap');wrap.innerHTML='<iframe src="'+embedUrl+'" allowfullscreen></iframe>';}}}

var prevElim={};
function initElim(st){(st.teams||[]).forEach(function(t){prevElim[t.color]={elim:t.eliminated,bed:t.hasBed};});}
function checkToasts(st){(st.teams||[]).forEach(function(t){var p=prevElim[t.color]||{};if(t.eliminated&&!p.elim)showToast('☠ '+t.color.toUpperCase()+' ELIMINATED',TC[t.color]);if(!t.hasBed&&p.bed!==false)showToast('💔 '+t.color.toUpperCase()+' BED DESTROYED',TC[t.color]);prevElim[t.color]={elim:t.eliminated,bed:t.hasBed};});}
function showToast(msg,color){var box=gid('toasts'),t=document.createElement('div');t.className='toast';t.style.color=color||'#fff';t.style.borderColor=(color||'#fff')+'44';t.textContent=msg;box.appendChild(t);setTimeout(function(){t.style.animation='toastOut .4s both';setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},400);},4500);}

var lastSig='',lastTC='';
function teamSig(st){return JSON.stringify((st.teams||[]).map(function(t){return t.color+'|'+t.eliminated+'|'+t.hasBed+'|'+(t.players||[]).map(function(p){return G.getPlayerName(p)+'/'+(G.isPlayerDead(p)?'1':'0');}).join(',');}))+'|'+JSON.stringify(st.scores)+'|'+JSON.stringify(st.playerStats||{})+'|'+st.teamMode;}

var s0=ST.get();
initElim(s0);applyTheme(s0);applyLayout(s0);updateTimerDOM(s0);renderSB(s0);
runTournCycle(s0);lastTC=JSON.stringify(s0.tournCards);
var at0=getActiveTeams(s0);if(s0.showTeams&&at0.length>0)cycleTo(0,s0);lastSig=teamSig(s0);
updateLogoScreens(s0);updateChat(s0);setMode(s0.overlayMode||'starting',s0);
if(s0.timerRunning)timerRAF=requestAnimationFrame(tickTimer);
if(s0.startingTimerRunning)startingRAF=requestAnimationFrame(tickStarting);
ST.sub(render);
</script>
